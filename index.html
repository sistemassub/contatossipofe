async function exportView(v){
  let rows=[],name=v;
  if(v==='contatos'){rows=contatosOrgs().flatMap(o=>o.ps.map(p=>({'Tipo de entidade':o.tipo,'Sigla':o.sigla,'Entidade':o.ent,'Unidade SEI':o.sei,'Nome':p.nome,'Ponto focal':p.focal?'SIM':'','Nível':p.fc,'Cargo':p.cargo,'Função':p.funcao,'Lotação':p.lot,'E-mail':p.email,'Celular':p.cel})));name='Contatos SIPOFE'}
  if(v==='fcs'){rows=fcsRows().map(x=>({'Cód. vínculo':x.cod,'Servidor':x.nome,'Órgão':x.org,'Entidade':x.ent,'Vínculo':x.vinc,'Cargo':x.cargo,'Lotação':x.lot,'Nível':x.fc,'Valor':x.valor,'E-mail':x.email,'Celular':x.cel}));name='FCs e GRGs'}
  if(v==='entrevistas'){rows=entRows().map(e=>({'Órgão':e.org,'Unidade':e.uni,'Processo SEI':e.sei,'Data envio':isoBR(e.env),'Data entrevista':isoBR(e.ent),'Grau':e.grau,'Servidor':e.nome,'Escolaridade':e.esc,'Experiência':e.exp,'Habilitação':e.hab,'Aprovação':e.apr,'Resultado':e.status,'Registro no roteiro':e.reg?`Sim (${e.reg.filled}/${D.roteiro.perguntas.length})`:'Não','No controle de FCs':e.fcRef?'Sim':e.status==='Deferido'?'Não (pendente)':'','Observações':e.obs}));name='Entrevistas FCs e GRGs'}
  let sheets=null;
  const agX=a=>({'Data':a.iso?isoBR(a.iso):a.dataRaw,'Horário':a.hor,'Órgão':a.org,'Situação da agenda':a.stA,'Situação da visita':a.stV,'Processo SEI':a.sei,'Contato no órgão':a.ct,'Pauta':a.pauta,'Participantes do órgão':a.orgPart.map(p=>p.nome+(p.cargo?' – '+p.cargo:'')).join('\n'),'Equipe SCPMA':a.scpma.map(p=>p.nome+(p.cargo?' – '+p.cargo:'')).join('\n'),'Encaminhamentos':a.enc});
  if(v==='agenda'){rows=agRows().map(agX);name='Agenda de visitas'}
  if(v==='roteiro'){const P=D.roteiro.perguntas;rows=regRows().map(x=>x.r).map(r=>{const o={'Candidato':r.nome,'Órgão':regOrg(r),'Data da entrevista':isoBR(regDate(r)),'Processo SEI':r.proc,'Etapas registradas':r.filled};P.forEach((q,k)=>{o[(k+1)+'. '+q.t.slice(0,60)]=r.resp[k]||''});return o});
    sheets=[['Registros',rows],['Etapas do roteiro',P.map((q,k)=>({'Nº':k+1,'Etapa':q.t,'Detalhamento':(q.det||[]).join('\n')}))]];name='Roteiro de entrevista'}
  if(v==='home'&&!fullAccess()){sheets=[['Contatos',D.contatos.flatMap(o=>o.pessoas.map(p=>({'Sigla':o.sigla,'Entidade':o.ent,'Nome':p.nome,'Ponto focal':p.focal?'SIM':'','Cargo':p.cargo,'E-mail':p.email})))],['Eixos GECEG',D.geceg.map(e=>({'Eixo':e.rn,'Nome':e.nome,'Coordenação':e.coord,'Monitor responsável':(monOf(e)||{}).resp||'','Substituto':(monOf(e)||{}).sub||''}))]];name='Panorama Rede SIPOFE'}
  else if(v==='home'){const lv=[1,2,3,4,5].map(n=>{const r=D.fcs.filter(f=>f.lvl===n);return{'Nível':'Nível '+n,'Servidores':r.length,'Valor mensal':r.reduce((a,f)=>a+f.valor,0)}});
    const ps=D.contatos.flatMap(o=>o.pessoas);
    sheets=[['Resumo',[{'Indicador':'Órgãos integrantes','Valor':(D.redeStats||{}).integrantes||''},{'Indicador':'Órgãos cadastrados','Valor':D.contatos.length},{'Indicador':'Contatos','Valor':ps.length},{'Indicador':'Pontos focais','Valor':ps.filter(p=>p.focal).length},{'Indicador':'FCs e GRGs','Valor':D.fcs.length},{'Indicador':'Valor mensal (R$)','Valor':D.fcs.reduce((a,f)=>a+f.valor,0)},{'Indicador':'Entrevistas','Valor':D.entrevistas.length},{'Indicador':'Em andamento','Valor':D.entrevistas.filter(e=>e.status==='Em andamento').length},{'Indicador':'Visitas','Valor':D.agenda.length}]],
      ['Por nível',lv],
      ['Por órgão',D.contatos.map(o=>({'Sigla':o.sigla,'Entidade':o.ent,'Contatos':o.pessoas.length,'Pontos focais':o.pessoas.filter(p=>p.focal).length,'Gratificados':D.fcs.filter(f=>norm(f.org)===norm(o.sigla)).length,'Entrevistas':D.entrevistas.filter(e=>norm(e.org).split(/\s*\/\s*/)[0]===norm(o.sigla)).length}))],
      ['Eixos GECEG',D.geceg.map(e=>({'Eixo':e.rn,'Nome':e.nome,'Coordenação':e.coord,'Monitor responsável':(monOf(e)||{}).resp||'','Substituto':(monOf(e)||{}).sub||'','Órgãos':e.orgaos.length}))],
      ['Entrevistas',D.entrevistas.map(e=>({'Servidor':e.nome,'Órgão':e.org,'Grau':e.grau,'Envio':isoBR(e.env),'Entrevista':isoBR(e.ent),'Resultado':e.status}))],
      ['Agenda',D.agenda.map(agX)]];name='Panorama Rede SIPOFE'}
  if(v==='geceg'){gecegFiltered().forEach(e=>e.orgaos.forEach(o=>rows.push({'Eixo':e.eixo,'Coordenador':e.coord,'Monitor responsável':(monOf(e)||{}).resp||'','Monitor substituto':(monOf(e)||{}).sub||'','Código':o.cod,'Órgão':o.org,'Gestor':o.gestor,'Titular':o.reps.filter(r=>/^tit/i.test(r.papel)).map(r=>r.nome).join('\n'),'E-mail do titular':o.reps.filter(r=>/^tit/i.test(r.papel)).map(r=>r.email).join('\n'),'Telefone do titular':o.reps.filter(r=>/^tit/i.test(r.papel)).map(r=>r.tel).join('\n'),'Suplente(s)':o.reps.filter(r=>!/^tit/i.test(r.papel)).map(r=>r.nome).join('\n'),'E-mail do suplente':o.reps.filter(r=>!/^tit/i.test(r.papel)).map(r=>r.email).join('\n'),'Telefone do suplente':o.reps.filter(r=>!/^tit/i.test(r.papel)).map(r=>r.tel).join('\n'),'Outros e-mails':o.mails.join('\n')})));name='Pontos focais GECEG'}
  if(!sheets)sheets=[[name,rows]];
  try{const X=await loadXLSX();const wb=X.utils.book_new();sheets.forEach(([n,r])=>{const ws=X.utils.json_to_sheet(r.length?r:[{'':'Nenhum registro'}]);const keys=Object.keys(r[0]||{});ws['!cols']=keys.map(k=>({wch:Math.min(60,Math.max(k.length,...r.map(x=>String(x[k]==null?'':x[k]).split('\n')[0].length))+2)}));X.utils.book_append_sheet(wb,ws,n.slice(0,31))});X.writeFile(wb,name+'.xlsx');toast(sheets.length>1?`${sheets.length} abas exportadas`:rows.length+' linhas exportadas')}catch(err){toast(err.message)}
}

/* ================= eventos ================= */
document.addEventListener('click',e=>{
  const fe=e.target.closest('[data-edit],[data-fsave],[data-fdel],[data-addrow],[data-delrow]');
  if(fe){e.preventDefault();e.stopPropagation();
    if(fe.dataset.edit!=null){if(!canEdit()){toast('Só administradores podem editar.');return}const [type,...args]=fe.dataset.edit.split(':');EDIT[type](...args.map(x=>x===''?null:x));return}
    if(fe.dataset.fsave!=null){saveForm();return}
    if(fe.dataset.fdel!=null){delForm(fe);return}
    if(fe.dataset.addrow){const f=FORM.fields.find(x=>x.k===fe.dataset.addrow);const box=document.querySelector(`[data-rows="${f.k}"]`);box.insertAdjacentHTML('beforeend',rowHTML(f,{}));const ins=box.lastElementChild.querySelector('input');ins&&ins.focus();return}
    if(fe.dataset.delrow!=null){fe.closest('.rw').remove();return}
  }
  const xb=e.target.closest('[data-xpt]');
  document.querySelectorAll('.xp.on').forEach(x=>{if(!xb||x!==xb.parentElement)x.classList.remove('on')});
  if(xb){e.preventDefault();xb.parentElement.classList.toggle('on');return}
  if(e.target.closest('[data-backup]')){backupDocs();return}
  const rb=e.target.closest('[data-report]');
  if(rb){e.preventDefault();e.stopPropagation();const [k,a]=rb.dataset.report.split(':');try{printReport(REPORT[k](a))}catch(err){console.error(err);toast('Não foi possível gerar o relatório')}return}
  const t=e.target.closest('[data-go],[data-clear],[data-copy],[data-mode],[data-export],[data-sort],[data-ent],[data-tab],[data-rsel],[data-csel],[data-vis],[data-setf],[data-close],[data-gi],[data-act]');
  if(!t) return;
  if(t.dataset.copy!=null){e.preventDefault();e.stopPropagation();const v=t.dataset.copy;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Copiado: '+v)).catch(()=>{const ta=document.createElement('textarea');ta.value=v;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copiado: '+v)}catch(_){}ta.remove()});return}
  if(t.dataset.gi!=null){pickHit(gList[+t.dataset.gi]);return}
  if(t.dataset.close!=null){closeAll();return}
  if(t.dataset.ent!=null){e.preventDefault();openEnt(+t.dataset.ent);return}
  if(t.dataset.go){let o=null;try{o=t.dataset.opts?JSON.parse(t.dataset.opts):null}catch(_){}
    if(o){const base={contatos:{q:'',org:'',tipo:'',focal:'',fc:''},geceg:{q:'',eixo:'',fac:''},fcs:{q:'',org:'',vinc:'',lvl:''},entrevistas:{q:'',status:'',ano:'',org:'',pend:''},agenda:{q:'',st:''}}[t.dataset.go]||{};o=Object.assign({},base,o)}
    go(t.dataset.go,o);return}
  if(t.dataset.mode){st.f.contatos.mode=t.dataset.mode;render();return}
  if(t.dataset.clear){Object.assign(st.f[t.dataset.clear],{q:'',org:'',tipo:'',focal:'',fc:'',status:'',ano:'',pend:'',vinc:'',lvl:'',eixo:'',fac:''});render();return}
  if(t.dataset.export){exportView(t.dataset.export);return}
  if(t.dataset.sort){const [v,k]=t.dataset.sort.split(':');const f=st.f[v];if(f.sort===k)f.dir*=-1;else{f.sort=k;f.dir=1}render();return}
  if(t.dataset.tab){st.f.roteiro.tab=t.dataset.tab;render();return}
  if(t.dataset.rsel!=null){st.f.roteiro.sel=+t.dataset.rsel;render();if(innerWidth<900){const d=document.querySelector('.md-body');d&&d.scrollIntoView({behavior:'smooth'})}return}
  if(t.dataset.csel!=null){st.f.contatos.sel=+t.dataset.csel;render();if(innerWidth<900){const d=document.querySelector('.md-body');d&&d.scrollIntoView({behavior:'smooth'})}return}
  if(t.dataset.vis!=null){const o=st.f.agenda.open;o[t.dataset.vis]=!o[t.dataset.vis];render();return}
  if(t.dataset.setf){const [v,k]=t.dataset.setf.split('.');st.f[v][k]=t.dataset.val;render();return}
});
let inT;
document.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.f)return;
  const [v,k]=t.dataset.f.split('.');
  st.f[v][k]=t.type==='checkbox'?t.checked:t.value;
  if(t.tagName==='INPUT'&&t.type!=='checkbox'){clearTimeout(inT);inT=setTimeout(()=>{const pos=t.selectionStart;render();const n=document.querySelector(`[data-f="${t.dataset.f}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}},160)}
  else render();
});

let hList=[],hSel=0;
function homeSearch(q){
  const box=$('#hres');if(!box)return;
  if(norm(q).length<2){box.classList.remove('on');box.innerHTML='';hList=[];return}
  if(!IDX.length)IDX=buildIndex();
  const groups={};IDX.filter(x=>matchQ(x.h,q)).forEach(h=>{(groups[h.g]=groups[h.g]||[]).push(h)});
  hList=[];let html='';
  Object.keys(groups).forEach(g=>{const arr=groups[g];html+=`<h6>${esc(g)} · ${arr.length}</h6>`;arr.slice(0,5).forEach(h=>{hList.push(h);html+=`<button data-hi="${hList.length-1}"><b>${esc(h.t)}</b><span>${esc(h.s)}</span>${h.m?`<em>${esc(h.m)}</em>`:''}</button>`})});
  box.innerHTML=html||`<div class="empty">Nada encontrado para “${esc(q)}”.</div>`;box.classList.add('on');hSel=0;hMark();
}
function hMark(){document.querySelectorAll('#hres button').forEach((b,i)=>b.classList.toggle('sel',i===hSel))}
document.addEventListener('input',e=>{if(e.target.id==='hq')homeSearch(e.target.value)});
document.addEventListener('keydown',e=>{if(e.target.id!=='hq')return;if(e.key==='ArrowDown'){e.preventDefault();hSel=Math.min(hSel+1,hList.length-1);hMark()}if(e.key==='ArrowUp'){e.preventDefault();hSel=Math.max(hSel-1,0);hMark()}if(e.key==='Enter'&&hList[hSel])pickHit(hList[hSel]);if(e.key==='Escape'){e.target.value='';homeSearch('')}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-hi]');if(b){pickHit(hList[+b.dataset.hi]);return}if(!e.target.closest('.hsearch')){const r=$('#hres');r&&r.classList.remove('on')}});
document.addEventListener('change',e=>{if(e.target.id==='fichaSel'){st.home.org=+e.target.value;$('#ficha').innerHTML=fichaHTML(st.home.org)}});
$('#gq').addEventListener('input',e=>runSearch(e.target.value));
$('#gq').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();gSel=Math.min(gSel+1,gList.length-1);markSel()}
  if(e.key==='ArrowUp'){e.preventDefault();gSel=Math.max(gSel-1,0);markSel()}
  if(e.key==='Enter'&&gList[gSel])pickHit(gList[gSel]);
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}
  if(e.key==='Escape')closeAll();
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&FORM&&$('#drawer').classList.contains('on')&&document.getElementById('frm')){e.preventDefault();saveForm()}
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();openSearch()}
});
$('#btnSearch').onclick=openSearch;
$('#ov').onclick=closeAll;
$('#btnMenu').onclick=()=>{$('#side').classList.add('on');$('#ov').classList.add('on')};
$('#btnAuth').onclick=()=>{if(ROLE==='visitante')go('entrar');else doLogout()};
document.addEventListener('click',e=>{
  if(e.target.closest('#btnOut2')){doLogout();return}
  if(e.target.closest('#btnRetry')){loadInitial();return}
  if(e.target.closest('#lgEye')){const i=$('#lgPass');i.type=i.type==='password'?'text':'password';return}
});
async function formLogin(){
  const u=$('#lgUser').value.trim(),pw=$('#lgPass').value,btn=$('#lgBtn'),er=$('#lgErr');
  if(!u||!pw){er.textContent='Informe usuário e senha.';return}
  btn.disabled=true;btn.innerHTML=`<span class="spin"></span>Entrando…`;er.textContent='';
  try{await doLogin(u,pw);
    if(ROLE==='visitante'){er.textContent='Seu usuário não tem permissão neste hub. Fale com um administrador do Hub SCPMA.';btn.disabled=false;btn.innerHTML=ic('login')+'Entrar';renderNav();return}
    st.home.org=null;go('home');toast('Bem-vindo(a), '+S(ME.nome).split(' ')[0]+'! Acesso: '+ROLE_LBL[ROLE])}
  catch(err){er.textContent=err.message||'Não foi possível entrar.';btn.disabled=false;btn.innerHTML=ic('login')+'Entrar'}
}
document.addEventListener('click',e=>{if(e.target.closest('#lgBtn')){e.preventDefault();formLogin()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&(e.target.id==='lgUser'||e.target.id==='lgPass')){e.preventDefault();formLogin()}});
$('#btnTheme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme==='dark';r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('conecta-sipofe-tema',r.dataset.theme)}catch(_){}renderNav()};
